<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b12">
  <title>TraceLens</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070b12;color:#eef5ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 15%,rgba(99,102,241,.18),transparent 32%),radial-gradient(circle at 20% 85%,rgba(34,211,238,.12),transparent 30%),#070b12}.boot{width:min(440px,calc(100% - 40px));padding:34px;border:1px solid rgba(148,163,184,.16);border-radius:22px;background:rgba(12,18,30,.88);box-shadow:0 28px 80px rgba(0,0,0,.42);backdrop-filter:blur(22px)}.brand{display:flex;align-items:center;gap:14px}.mark{width:48px;height:48px;display:grid;place-items:center;border:1px solid rgba(103,232,249,.3);border-radius:14px;color:#67e8f9;background:rgba(103,232,249,.07);font-size:22px}.brand strong{display:block;font-size:18px}.brand small{display:block;margin-top:4px;color:#8491a8;font-size:9px;letter-spacing:.18em}.status{margin-top:34px;color:#aab6c9;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em}.track{height:2px;margin-top:14px;overflow:hidden;background:rgba(148,163,184,.12)}.track i{display:block;width:42%;height:100%;background:linear-gradient(90deg,transparent,#67e8f9,transparent);animation:scan 1.2s ease-in-out infinite}.error{color:#fb7185;line-height:1.55;letter-spacing:0;font-family:inherit;font-weight:500}@keyframes scan{from{transform:translateX(-110%)}to{transform:translateX(300%)}}
  </style>
</head>
<body>
  <main class="boot" aria-live="polite">
    <div class="brand"><span class="mark">◎</span><span><strong>TraceLens</strong><small>INTELLIGENCE SUITE</small></span></div>
    <div class="status" id="status">INITIALISERER SIKKERT ARBEIDSOMRÅDE</div>
    <div class="track"><i></i></div>
  </main>
  <script>
  (()=>{
    const PARTS=6;
    const EXPECTED='d5aa22218653063356cfdead0e3858ff9f8980b47121b4f47a57c0482a9ceeeb';
    const status=document.getElementById('status');
    const text=bytes=>new TextDecoder().decode(bytes).replace(/\0.*$/s,'').trim();
    const hex=buffer=>[...new Uint8Array(buffer)].map(v=>v.toString(16).padStart(2,'0')).join('');
    function parseTar(bytes){
      const files={};let offset=0;
      while(offset+512<=bytes.length){
        const header=bytes.subarray(offset,offset+512);const name=text(header.subarray(0,100));
        if(!name)break;
        const size=parseInt(text(header.subarray(124,136))||'0',8)||0;
        const start=offset+512;files[name]=bytes.slice(start,start+size);
        offset=start+Math.ceil(size/512)*512;
      }
      return files;
    }
    async function boot(){
      try{
        status.textContent='LASTER VERIFISERT PRODUKTPAKKE';
        const parts=await Promise.all(Array.from({length:PARTS},(_,i)=>fetch(`bundle/chunk-${String(i).padStart(2,'0')}`,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(`Mangler produktdel ${i+1}`);return r.text();})));
        const raw=atob(parts.join('').replace(/\s/g,''));
        const packed=Uint8Array.from(raw,c=>c.charCodeAt(0));
        const digest=hex(await crypto.subtle.digest('SHA-256',packed));
        if(digest!==EXPECTED)throw new Error('Integritetskontrollen av produktpakken feilet');
        if(typeof DecompressionStream==='undefined')throw new Error('Nettleseren støtter ikke sikker dekomprimering');
        status.textContent='KLARGJØR ANALYSEVERKTØY';
        const stream=new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
        const files=parseTar(new Uint8Array(await new Response(stream).arrayBuffer()));
        let html=text(files['index.html']);
        const css=text(files['styles.css']);
        let js=text(files['app.js']);
        const icon=text(files['assets/icon.svg']);
        if(!html||!css||!js)throw new Error('Produktpakken er ufullstendig');
        js=js.replace("if('serviceWorker' in navigator && location.protocol==='https:') window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));",'');
        html=html
          .replace(/<link rel="stylesheet" href="styles\.css"\s*\/?>(?:\s*)/i,`<style>${css.replace(/<\/style/gi,'<\\/style')}</style>`)
          .replace(/<link rel="manifest"[^>]*>/i,'')
          .replace(/<link rel="icon"[^>]*>/i,`<link rel="icon" href="data:image/svg+xml,${encodeURIComponent(icon)}" type="image/svg+xml">`)
          .replace(/<script src="app\.js" defer><\/script>/i,`<script>${js.replace(/<\/script/gi,'<\\/script')}<\/script>`);
        document.open();document.write(html);document.close();
      }catch(error){
        console.error(error);status.className='status error';status.textContent=`TraceLens kunne ikke starte: ${error.message}. Last siden på nytt.`;
      }
    }
    boot();
  })();
  </script>
</body>
</html>
